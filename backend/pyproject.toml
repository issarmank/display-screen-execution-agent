[project]
name = "screen-execution-agent-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "elevenlabs>=2.69",
    "websockets>=13",
    "sqlalchemy>=2.0",
    "alembic",
    "pydantic-settings",
    "python-dotenv",
    "sounddevice",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff", "mypy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: live API tests (skipped unless run with -m integration)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["^\\.venv/"]

[[tool.mypy.overrides]]
module = ["sounddevice"]
ignore_missing_imports = true
